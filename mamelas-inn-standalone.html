<style>
  :root{
    /* Mamela's Inn — rust, cream & dark-wood palette, drawn from the inn's own signage */
    --ink-950:#181310;
    --ink-900:#211A15;
    --ink-800:#2C2319;
    --ink-700:#3D3020;
    --ink-line:#4C3C29;
    --brass:#B8420F;
    --brass-bright:#E0672B;
    --paper:#FFFFFF;
    --paper-panel:#FFFFFF;
    --paper-line:#E8E1D6;
    --text-ink:#231A12;
    --text-muted:#6B6156;
    --text-muted-dark:#B9AA98;
    --vacant:#3E6B49;
    --vacant-bright:#5C9169;
    --occupied:#8C5A1D;
    --occupied-bright:#B98530;
    --overdue:#9C3A2E;
    --overdue-bright:#C2574A;
    --bg: var(--paper);
    --panel: var(--paper-panel);
    --header-bg: #FFFFFF;
    --line: var(--paper-line);
    --text: var(--text-ink);
    --text-muted-c: var(--text-muted);
    --nav-pill: rgba(35,26,18,.06);
    --nav-pill-text: rgba(35,26,18,.72);
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg: var(--ink-950);
    --panel: var(--ink-900);
    --header-bg: var(--ink-900);
    --line: var(--ink-line);
    --text: #F3ECE3;
    --text-muted-c: var(--text-muted-dark);
    --nav-pill: rgba(255,255,255,.08);
    --nav-pill-text: rgba(243,236,227,.75);
    color-scheme: dark;
  }
  html,body{ background:var(--bg); color:var(--text); }
  *{ transition: background-color .7s ease, border-color .7s ease, color .7s ease; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  body{ font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
  .font-display{ font-family:'Fraunces',ui-serif,Georgia,serif; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .tabular{ font-variant-numeric: tabular-nums; }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(8px) scale(.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .anim-rise{ animation: riseIn .22s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(16px);} to{ opacity:1; transform:translateX(0);} }
  .anim-toast{ animation: toastIn .25s cubic-bezier(.2,.7,.3,1) both; }
  .key-tag{ position:relative; }
  .key-tag::before{
    content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:14px; height:14px; border-radius:999px; background:rgba(0,0,0,.18);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
  }
  .focus-ring:focus-visible{ outline:2px solid var(--brass-bright); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){
    .anim-rise,.anim-toast{ animation:none !important; }
    *{ transition:none !important; }
  }
</style>

const PHP = new Intl.NumberFormat('en-PH', { style:'currency', currency:'PHP', maximumFractionDigits:0 });
const fmtMoney = (n) => PHP.format(Number(n)||0);
const pad2 = (n) => String(n).padStart(2,'0');

function toLocalInputValue(d){
  const dt = new Date(d);
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}T${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`;
}
function fromLocalInputValue(v){
  // treat as local time
  return new Date(v).toISOString();
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-PH', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtClock(d){
  return d.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function remaining(msLeft){
  const overdue = msLeft < 0;
  const abs = Math.abs(msLeft);
  const h = Math.floor(abs/3600000);
  const m = Math.floor((abs%3600000)/60000);
  return { overdue, h, m };
}
function rand4(){
  return String(Math.floor(1000 + Math.random()*9000));
}
function refPrefix(){
  const d = new Date();
  return `INN-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
}
function genReference(existingRefs){
  let ref;
  let guard = 0;
  do {
    ref = `${refPrefix()}-${rand4()}`;
    guard++;
  } while(existingRefs.has(ref) && guard < 50);
  return ref;
}
function uid(){ return Math.random().toString(36).slice(2,10); }

function browserDownload(filename, data, mime){
  const blob = (data instanceof Blob) ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

/* ============================== TOASTS ============================== */
function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, kind='success')=>{
    const id = uid();
    setToasts(t=>[...t, {id, msg, kind}]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3400);
  },[]);
  const view = (
    <div className="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 items-end">
      {toasts.map(t=>(
        <div key={t.id} className={
          "anim-toast flex items-center gap-2 px-4 py-3 rounded-lg shadow-xl border text-sm font-medium " +
          (t.kind==='success' ? "bg-[var(--vacant)] border-[var(--vacant-bright)] text-white" :
           t.kind==='error' ? "bg-[var(--overdue)] border-[var(--overdue-bright)] text-white" :
           "bg-[var(--panel)] border-[var(--line)] text-[var(--text)]")
        }>
          {t.kind==='success' ? <CheckIcon size={16}/> : t.kind==='error' ? <AlertIcon size={16}/> : <SparkIcon size={16}/>}
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
  return { push, view };
}

/* ============================== DB HOOK ============================== */
const LS_ROOMS = 'mamela_rooms_v1';
const LS_TXNS = 'mamela_txns_v1';
const LS_SETTINGS = 'mamela_settings_v1';

function lsGetJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function lsSetJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage unavailable */ }
}

function useInnDb(pushToast){
  const [ready, setReady] = useState(false);
  const [rooms, setRooms] = useState(DEFAULT_ROOMS);
  const [txns, setTxns] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);

  useEffect(()=>{
    setRooms(lsGetJSON(LS_ROOMS, DEFAULT_ROOMS));
    setTxns(lsGetJSON(LS_TXNS, []));
    setSettings({ ...DEFAULT_SETTINGS, ...lsGetJSON(LS_SETTINGS, {}) });
    setReady(true);
  },[]);

  const api = useMemo(()=>({
    ready, dbAvailable: true,
    rooms, txns, settings,

    async saveRoom(room){
      setRooms(rs=>{
        const idx = rs.findIndex(r=>r.id===room.id);
        const next = idx===-1 ? [...rs, room] : (()=>{ const c=[...rs]; c[idx]=room; return c; })();
        lsSetJSON(LS_ROOMS, next);
        return next;
      });
    },
    async deleteRoom(id){
      setRooms(rs=>{
        const next = rs.filter(r=>r.id!==id);
        lsSetJSON(LS_ROOMS, next);
        return next;
      });
    },
    async saveTxn(txn){
      setTxns(ts=>{
        const idx = ts.findIndex(t=>t.ref===txn.ref);
        const next = idx===-1 ? [txn, ...ts] : (()=>{ const c=[...ts]; c[idx]=txn; return c; })();
        lsSetJSON(LS_TXNS, next);
        return next;
      });
    },
    async saveSettings(next){
      setSettings(next);
      lsSetJSON(LS_SETTINGS, next);
    },
  }),[ready, rooms, txns, settings]);

  return api;
}

/* ============================== ROOM CARD ============================== */
function useNow(intervalMs=1000){
  const [now, setNow] = useState(new Date());
  useEffect(()=>{
    const t = setInterval(()=> setNow(new Date()), intervalMs);
    return ()=> clearInterval(t);
  },[intervalMs]);
  return now;
}

function RoomCard({ room, now, selectMode, selected, onToggleSelect, onOpen }){
  const isOccupied = room.status === 'occupied';
  let bgClasses, edgeShadow, statusText;
  let timeLabel = null;

  if(isOccupied){
    const msLeft = new Date(room.timeOut).getTime() - now.getTime();
    const { overdue, h, m } = remaining(msLeft);
    timeLabel = `${overdue ? 'Overdue by' : ''} ${h}h ${pad2(m)}m ${overdue ? '' : 'left'}`.replace(/\s+/g,' ').trim();
    if(overdue){
      bgClasses = "bg-[var(--overdue)] border-[var(--overdue-bright)] text-white";
      edgeShadow = "0 5px 0 #612420";
      statusText = 'Overdue';
    } else {
      bgClasses = "bg-[var(--occupied)] border-[var(--occupied-bright)] text-white";
      edgeShadow = "0 5px 0 #5A3A12";
      statusText = 'Occupied';
    }
  } else {
    bgClasses = "bg-[var(--vacant)] border-[var(--vacant-bright)] text-white";
    edgeShadow = "0 5px 0 #24432E";
    statusText = 'Vacant';
  }

  const handleClick = () => {
    if(selectMode && !isOccupied){ onToggleSelect(room.id); return; }
    onOpen(room);
  };

  return (
    <button
      onClick={handleClick}
      className={
        "key-tag focus-ring group relative rounded-2xl border-[3px] pt-8 pb-4 px-4 text-left transition-all duration-150 " +
        "hover:-translate-y-0.5 active:translate-y-1 " + bgClasses +
        (selected ? " ring-4 ring-[var(--brass-bright)] ring-offset-2 ring-offset-[var(--bg)]" : "")
      }
      style={{ minHeight: '168px', boxShadow: edgeShadow + ", 0 10px 18px rgba(0,0,0,.28)" }}
      onMouseDown={(e)=>{ e.currentTarget.style.boxShadow = "0 1px 0 rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.25)"; }}
      onMouseUp={(e)=>{ e.currentTarget.style.boxShadow = edgeShadow + ", 0 10px 18px rgba(0,0,0,.28)"; }}
      onMouseLeave={(e)=>{ e.currentTarget.style.boxShadow = edgeShadow + ", 0 10px 18px rgba(0,0,0,.28)"; }}
    >
      {selectMode && !isOccupied && (
        <span className={
          "absolute top-2.5 right-2.5 w-6 h-6 rounded-full border-2 flex items-center justify-center " +
          (selected ? "bg-white text-[var(--vacant)] border-white" : "border-white/70 text-transparent")
        }>
          <CheckIcon size={14}/>
        </span>
      )}

      <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/22 text-[11px] font-extrabold uppercase tracking-wider">
        {isOccupied ? <UsersIcon size={13}/> : <BedIcon size={13}/>}
        {statusText}
      </span>

      <div className="mt-2.5 font-display text-4xl font-bold tabular leading-none">{room.number}</div>

      {isOccupied ? (
        <div className="mt-3 space-y-1">
          <div className="text-sm font-semibold truncate">{room.guestName || 'Guest'}</div>
          <div className="flex items-center gap-1 text-xs font-bold tabular bg-black/18 rounded-md px-1.5 py-0.5 w-fit">
            <ClockIcon size={12}/> {timeLabel}
          </div>
        </div>
      ) : (
        <div className="mt-3 text-xs font-semibold opacity-90">₱{room.rate}/hr · tap to check in</div>
      )}
    </button>
  );
}

function Modal({ open, onClose, children, wide }){

         onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className={"anim-rise w-full " + (wide ? "max-w-2xl" : "max-w-md") + " rounded-2xl border shadow-2xl overflow-hidden max-h-[92vh] flex flex-col"}
           style={{ background:'var(--panel)', borderColor:'var(--line)' }}>
        {children}
      </div>
    </div>
  );
}

  if(!room) return null;
  const msLeft = txn ? new Date(txn.timeOut).getTime() - now.getTime() : 0;
  const { overdue, h, m } = remaining(msLeft);

  return (
    <Modal open={!!room} onClose={onClose}>

          </div>
          <button onClick={onClose} className="focus-ring p-2 rounded-lg hover:bg-black/10"><XIcon size={18}/></button>

            <div className={"rounded-lg px-4 py-3 flex items-center gap-2 text-sm font-medium " +
              (overdue ? "bg-[var(--overdue)]/15 text-[var(--overdue-bright)]" : "bg-[var(--occupied)]/15 text-[var(--occupied-bright)]")}>
              <ClockIcon size={16}/>
              {overdue ? `Overdue by ${h}h ${pad2(m)}m` : `${h}h ${pad2(m)}m remaining`}
            </div>

            <dl className="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
              <div><dt style={{color:'var(--text-muted-c)'}}>Reference #</dt><dd className="font-semibold tabular">{txn.ref}</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Guest name</dt><dd className="font-semibold">{txn.guestName}</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Rooms</dt><dd className="font-semibold">{(txn.roomIds||[]).join(', ')}</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Duration</dt><dd className="font-semibold">{txn.hours} hrs</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Time in</dt><dd className="font-semibold">{fmtDateTime(txn.timeIn)}</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Time out</dt><dd className="font-semibold">{fmtDateTime(txn.timeOut)}</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Payment method</dt><dd className="font-semibold">{txn.paymentMethod}</dd></div>
              <div><dt style={{color:'var(--text-muted-c)'}}>Total paid</dt><dd className="font-semibold">{fmtMoney(txn.totalAmount)}</dd></div>
            </dl>

            <button
              onClick={()=>onCheckout(txn)}
              className="focus-ring w-full mt-2 flex items-center justify-center gap-2 rounded-lg bg-[var(--vacant)] hover:bg-[var(--vacant-bright)] text-white font-semibold py-3 transition-colors"
            >
              <LogOutIcon size={18}/> Check Out Guest
            </button>
          </div>
        ) : (
          <div className="text-sm" style={{color:'var(--text-muted-c)'}}>No active transaction found for this room.</div>
        )}
      </div>
    </Modal>
  );
}

/* ============================== DATE PICKER (calendar) ============================== */
function DatePicker({ value, onChange }){
  const [open, setOpen] = useState(false);
  const [viewMonth, setViewMonth] = useState(()=> new Date(value.getFullYear(), value.getMonth(), 1));

  useEffect(()=>{ if(open) setViewMonth(new Date(value.getFullYear(), value.getMonth(), 1)); },[open]);

  const firstWeekday = viewMonth.getDay();
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0).getDate();
  const today = new Date();
  const isSameDay = (a,b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const pick = (d) => {
    onChange(new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d, value.getHours(), value.getMinutes()));
    setOpen(false);
  };

  return (
    <div>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        className="focus-ring w-full flex items-center gap-2 px-3 py-2.5 rounded-lg border bg-transparent text-left text-sm sm:text-base"
        style={{borderColor:'var(--line)'}}>
        <CalendarIcon size={16} className="shrink-0" style={{color:'var(--brass)'}}/>
        <span className="tabular truncate">{value.toLocaleDateString('en-PH',{month:'short', day:'numeric', year:'numeric'})}</span>
      </button>
      {open && (
        <div className="anim-rise mt-2 w-full rounded-xl border p-3" style={{background:'var(--bg)', borderColor:'var(--line)'}}>
          <div className="flex items-center justify-between mb-2">
            <button type="button" onClick={()=>setViewMonth(m=>new Date(m.getFullYear(), m.getMonth()-1, 1))}
              className="focus-ring p-1.5 rounded-md hover:bg-black/10"><ChevronR size={16} style={{transform:'rotate(180deg)'}}/></button>
            <div className="font-display font-semibold text-sm">{viewMonth.toLocaleDateString('en-PH',{month:'long', year:'numeric'})}</div>
            <button type="button" onClick={()=>setViewMonth(m=>new Date(m.getFullYear(), m.getMonth()+1, 1))}
              className="focus-ring p-1.5 rounded-md hover:bg-black/10"><ChevronR size={16}/></button>
          </div>
          <div className="grid grid-cols-7 gap-1 text-center text-[11px] font-semibold mb-1" style={{color:'var(--text-muted-c)'}}>
            {['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d,i)=>{
              if(d===null) return <div key={i}/>;
              const cellDate = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d);
              const selected = isSameDay(cellDate, value);
              const isToday = isSameDay(cellDate, today);
              return (
                <button key={i} type="button" onClick={()=>pick(d)}
                  className={"focus-ring h-9 rounded-md text-sm font-semibold tabular transition-colors " +
                    (selected ? "bg-[var(--brass)] text-white" : isToday ? "border-2" : "hover:bg-black/10")}
                  style={ (!selected && isToday) ? {borderColor:'var(--brass)'} : {} }>
                  {d}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== TIME PICKER (scrollable wheel) ============================== */
function TimePicker({ value, onChange }){
  const [open, setOpen] = useState(false);
  const hourColRef = useRef(null);
  const minColRef = useRef(null);

  const h24 = value.getHours();
  const h12 = ((h24 % 12) || 12);
  const minute5 = Math.round(value.getMinutes()/5)*5 % 60;
  const ampm = h24 >= 12 ? 'PM' : 'AM';

  const hoursList = Array.from({length:12},(_,i)=>i+1);
  const minutesList = Array.from({length:12},(_,i)=>i*5);

  useEffect(()=>{
    if(!open) return;
    setTimeout(()=>{
      const hIdx = hoursList.indexOf(h12);
      const mIdx = minutesList.indexOf(minute5);
      if(hourColRef.current && hourColRef.current.children[hIdx]) hourColRef.current.children[hIdx].scrollIntoView({ block:'center' });
      if(minColRef.current && minColRef.current.children[mIdx]) minColRef.current.children[mIdx].scrollIntoView({ block:'center' });
    }, 20);
  },[open]);

  const setHour12 = (h) => {
    let newH24 = h % 12;
    if(ampm==='PM') newH24 += 12;
    onChange(new Date(value.getFullYear(), value.getMonth(), value.getDate(), newH24, value.getMinutes()));
  };
  const setMinute = (m) => onChange(new Date(value.getFullYear(), value.getMonth(), value.getDate(), h24, m));
  const setAmPm = (ap) => {
    let newH24 = h12 % 12;
    if(ap==='PM') newH24 += 12;
    onChange(new Date(value.getFullYear(), value.getMonth(), value.getDate(), newH24, value.getMinutes()));
  };

  return (
    <div>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        className="focus-ring w-full flex items-center gap-2 px-3 py-2.5 rounded-lg border bg-transparent text-left tabular text-sm sm:text-base"
        style={{borderColor:'var(--line)'}}>
        <ClockIcon size={16} className="shrink-0" style={{color:'var(--brass)'}}/>
        <span>{pad2(h12)}:{pad2(minute5)} {ampm}</span>
      </button>
      {open && (
        <div className="anim-rise mt-2 rounded-xl border p-3" style={{background:'var(--bg)', borderColor:'var(--line)'}}>
          <div className="flex gap-2">
            <div ref={hourColRef} className="flex-1 h-36 overflow-y-auto snap-y snap-mandatory rounded-lg border" style={{borderColor:'var(--line)'}}>
              <div className="h-14"/>
              {hoursList.map(h=>(
                <button key={h} type="button" onClick={()=>setHour12(h)}
                  className={"focus-ring w-full snap-center text-center py-2.5 text-sm font-bold tabular " +
                    (h===h12 ? "bg-[var(--brass)] text-white" : "hover:bg-black/10")}>{pad2(h)}</button>
              ))}
              <div className="h-14"/>
            </div>
            <div ref={minColRef} className="flex-1 h-36 overflow-y-auto snap-y snap-mandatory rounded-lg border" style={{borderColor:'var(--line)'}}>
              <div className="h-14"/>
              {minutesList.map(m=>(
                <button key={m} type="button" onClick={()=>setMinute(m)}
                  className={"focus-ring w-full snap-center text-center py-2.5 text-sm font-bold tabular " +
                    (m===minute5 ? "bg-[var(--brass)] text-white" : "hover:bg-black/10")}>{pad2(m)}</button>
              ))}
              <div className="h-14"/>
            </div>
            <div className="flex flex-col gap-1.5 justify-center">
              {['AM','PM'].map(ap=>(
                <button key={ap} type="button" onClick={()=>setAmPm(ap)}
                  className={"focus-ring px-2.5 py-2.5 rounded-lg text-xs font-bold " +
                    (ap===ampm ? "bg-[var(--brass)] text-white" : "border")}
                  style={ ap===ampm ? {} : {borderColor:'var(--line)'} }>{ap}</button>
              ))}
            </div>
          </div>
          <button type="button" onClick={()=>setOpen(false)}
            className="focus-ring mt-2 w-full py-2 rounded-lg text-xs font-bold border" style={{borderColor:'var(--line)'}}>Done</button>
        </div>
      )}
    </div>
  );
}

/* ============================== CHECK-IN MODAL ============================== */
function CheckInModal({ open, initialRooms, allRooms, existingRefs, defaultRate, onClose, onConfirm }){
  const [ref] = useState(()=> genReference(existingRefs));
  const [guestName, setGuestName] = useState('');
  const [roomIds, setRoomIds] = useState([]);
  const [hours, setHours] = useState(3);
  const [timeInDate, setTimeInDate] = useState(()=> new Date());
  const [paymentMethod, setPaymentMethod] = useState('Cash');
  const [amount, setAmount] = useState(0);
  const [amountTouched, setAmountTouched] = useState(false);
  const [error, setError] = useState('');

  useEffect(()=>{
    if(open) setRoomIds(initialRooms || []);
  },[open, initialRooms]);

  useEffect(()=>{
    if(!open) return;
    setGuestName(''); setHours(3); setTimeInDate(new Date());
    setPaymentMethod('Cash'); setAmountTouched(false); setError('');
  },[open]);

  const selectedRoomObjs = allRooms.filter(r=> roomIds.includes(r.id));
  const ratesSum = selectedRoomObjs.reduce((s,r)=> s + (Number(r.rate)||defaultRate), 0);
  const suggestedAmount = ratesSum * Number(hours||0);

  useEffect(()=>{
    if(!amountTouched) setAmount(suggestedAmount);
  }, [suggestedAmount, amountTouched]);

  const timeOutIso = useMemo(()=>{
    return new Date(timeInDate.getTime() + Number(hours||0)*3600000).toISOString();
  },[timeInDate, hours]);

  if(!open) return null;

  const submit = () => {
    if(!guestName.trim()){ setError('Guest name is required.'); return; }
    if(roomIds.length===0){ setError('Select at least one room.'); return; }
    if(!hours || Number(hours) <= 0){ setError('Duration must be greater than zero.'); return; }
    setError('');
    onConfirm({
      ref,
      guestName: guestName.trim(),
      roomIds,
      hours: Number(hours),
      timeIn: timeInDate.toISOString(),
      timeOut: timeOutIso,
      paymentMethod,
      totalAmount: Number(amount)||0,
      status: 'active',
      createdAt: new Date().toISOString(),
    });
  };

  return (
    <Modal open={open} onClose={onClose} wide>
      <div className="flex-1 overflow-y-auto">
        <div className="px-5 sm:px-6 pt-5 sm:pt-6 pb-4 border-b flex items-start justify-between" style={{borderColor:'var(--line)'}}>
          <div>
            <div className="text-xs uppercase tracking-wide font-semibold" style={{color:'var(--text-muted-c)'}}>New Check-In</div>
            <div className="font-display text-2xl font-semibold">Guest Registration</div>
          </div>
          <button onClick={onClose} className="focus-ring p-2 rounded-lg hover:bg-black/10"><XIcon size={18}/></button>
        </div>

        <div className="p-5 sm:p-6 space-y-5">
          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Reference Number</label>
            <div className="mt-1 font-display text-lg font-semibold tabular px-3 py-2 rounded-lg border" style={{borderColor:'var(--line)', background:'rgba(201,162,75,.08)'}}>{ref}</div>
          </div>

          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Guest Name</label>
            <input value={guestName} onChange={e=>setGuestName(e.target.value)} placeholder="Juan Dela Cruz"
                   className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none"
                   style={{borderColor:'var(--line)'}} />
          </div>

          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Room(s) Selected</label>
            <div className="mt-2 flex flex-wrap gap-2">
              {allRooms.map(r=>{
                const active = roomIds.includes(r.id);
                const disabled = r.status==='occupied' && !active;
                return (
                  <button key={r.id} type="button" disabled={disabled}
                    onClick={()=> setRoomIds(ids => active ? ids.filter(x=>x!==r.id) : [...ids, r.id])}
                    className={
                      "focus-ring px-3 py-1.5 rounded-full text-sm font-semibold border transition-colors " +
                      (active ? "bg-[var(--brass)] border-[var(--brass-bright)] text-white" :
                       disabled ? "opacity-30 cursor-not-allowed border-[var(--line)]" :
                       "border-[var(--line)] hover:border-[var(--brass-bright)]")
                    }>
                    {r.number}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Duration (hours)</label>
              <input type="number" min="1" value={hours} onChange={e=>setHours(e.target.value)}
                     className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none tabular"
                     style={{borderColor:'var(--line)'}} />
              <div className="mt-1.5 flex gap-1.5 flex-wrap">
                {[3,6,12,22,24].map(h=>(
                  <button key={h} type="button" onClick={()=>setHours(h)}
                    className="focus-ring text-xs px-2 py-1 rounded-md border hover:border-[var(--brass-bright)]"
                    style={{borderColor:'var(--line)'}}>{h}h</button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Payment Method</label>
              <select value={paymentMethod} onChange={e=>setPaymentMethod(e.target.value)}
                      className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none"
                      style={{borderColor:'var(--line)'}}>
                {PAYMENT_METHODS.map(m=> <option key={m} value={m} style={{color:'#111'}}>{m}</option>)}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Date In</label>
              <div className="mt-1"><DatePicker value={timeInDate} onChange={setTimeInDate}/></div>
            </div>
            <div>
              <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Time In</label>
              <div className="mt-1"><TimePicker value={timeInDate} onChange={setTimeInDate}/></div>
            </div>
          </div>

          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Date &amp; Time Out (auto)</label>
            <div className="mt-1 w-full px-3 py-2.5 rounded-lg border tabular text-sm sm:text-base" style={{borderColor:'var(--line)', color:'var(--text-muted-c)'}}>
              {timeOutIso ? fmtDateTime(timeOutIso) : '—'}
            </div>
          </div>

          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Total Payment Amount</label>
            <div className="mt-1 relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:'var(--text-muted-c)'}}>₱</span>
              <input type="number" min="0" value={amount}
                     onChange={e=>{ setAmount(e.target.value); setAmountTouched(true); }}
                     className="focus-ring w-full pl-7 pr-3 py-2 rounded-lg border bg-transparent outline-none tabular"
                     style={{borderColor:'var(--line)'}} />
            </div>
            <div className="mt-1 text-xs" style={{color:'var(--text-muted-c)'}}>Suggested: {fmtMoney(suggestedAmount)} ({selectedRoomObjs.length} room{selectedRoomObjs.length===1?'':'s'} × {hours||0}h)</div>
          </div>

          {error && (
            <div className="flex items-center gap-2 text-sm text-[var(--overdue-bright)]"><AlertIcon size={16}/>{error}</div>
          )}

          <button onClick={submit}
            className="focus-ring w-full flex items-center justify-center gap-2 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white font-bold py-3 transition-colors">
            <LogInIcon size={18}/> Confirm Check-In
          </button>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== FRONT DESK VIEW ============================== */
function FrontDesk({ dbApi, pushToast }){
  const now = useNow(1000);
  const { rooms, txns } = dbApi;
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState([]);
  const [checkInOpen, setCheckInOpen] = useState(false);
  const [checkInRooms, setCheckInRooms] = useState([]);
  const [infoRoom, setInfoRoom] = useState(null);

  const existingRefs = useMemo(()=> new Set(txns.map(t=>t.ref)), [txns]);
  const activeTxnByRoom = useMemo(()=>{
    const map = {};
    txns.filter(t=>t.status==='active').forEach(t=> (t.roomIds||[]).forEach(rid=> map[rid]=t));
    return map;
  },[txns]);

  const openRoom = (room) => {
    if(room.status==='occupied'){ setInfoRoom(room); return; }
    setCheckInRooms([room.id]);
    setCheckInOpen(true);
  };

  const toggleSelect = (id) => {
    setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  };

  const startMultiCheckIn = () => {
    if(selected.length===0) return;
    setCheckInRooms(selected);
    setCheckInOpen(true);
  };

  const confirmCheckIn = async (txn) => {
    try{
      await dbApi.saveTxn(txn);
      for(const rid of txn.roomIds){
        const room = rooms.find(r=>r.id===rid);
        await dbApi.saveRoom({
          ...(room||{id:rid, number:rid, rate: dbApi.settings.defaultRate}),
          status:'occupied', txnId: txn.ref, guestName: txn.guestName, timeOut: txn.timeOut,
        });
      }
      setCheckInOpen(false);
      setSelected([]); setSelectMode(false);
      pushToast(`Checked in ${txn.guestName} — ${txn.roomIds.join(', ')} · ${txn.ref}`);
    }catch(e){
      pushToast('Check-in failed. Please try again.', 'error');
    }
  };

  const checkout = async (txn) => {
    try{
      await dbApi.saveTxn({ ...txn, status:'completed', actualTimeOut: new Date().toISOString() });
      for(const rid of txn.roomIds){
        const room = rooms.find(r=>r.id===rid);
        await dbApi.saveRoom({ ...(room||{id:rid, number:rid, rate: dbApi.settings.defaultRate}), status:'vacant', txnId:null, guestName:null, timeOut:null });
      }
      setInfoRoom(null);
      pushToast(`Room ${(txn.roomIds||[]).join(', ')} checked out. Now vacant.`);
    }catch(e){
      pushToast('Checkout failed. Please try again.', 'error');
    }
  };

  const vacantCount = rooms.filter(r=>r.status==='vacant').length;
  const occupiedCount = rooms.length - vacantCount;

  return (
    <div>
      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
        <div className="flex items-center gap-4 text-sm">
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[var(--vacant-bright)]"></span>{vacantCount} vacant</div>
          <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[var(--occupied-bright)]"></span>{occupiedCount} occupied</div>
        </div>
        <div className="flex items-center gap-2">
          {selectMode && selected.length>0 && (
            <button onClick={startMultiCheckIn}
              className="focus-ring flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white font-semibold text-sm">
              <LogInIcon size={16}/> Check In Selected ({selected.length})
            </button>
          )}
          <button onClick={()=>{ setSelectMode(s=>!s); setSelected([]); }}
            className={
              "focus-ring flex items-center gap-2 px-4 py-2 rounded-lg border font-semibold text-sm transition-colors " +
              (selectMode ? "bg-[var(--brass)] border-[var(--brass-bright)] text-white" : "border-[var(--line)] hover:border-[var(--brass-bright)]")
            }>
            <GridIcon size={16}/> Multi-Room Select Mode {selectMode ? 'On' : 'Off'}
          </button>
        </div>
      </div>

      <div className="grid gap-3 sm:gap-4" style={{ gridTemplateColumns:'repeat(auto-fill, minmax(135px, 1fr))' }}>
        {rooms.map(room=>(
          <RoomCard key={room.id} room={room} now={now}
            selectMode={selectMode} selected={selected.includes(room.id)}
            onToggleSelect={toggleSelect} onOpen={openRoom}/>
        ))}
      </div>

      <GuestInfoModal room={infoRoom} txn={infoRoom ? activeTxnByRoom[infoRoom.id] : null}
        onClose={()=>setInfoRoom(null)} onCheckout={checkout}/>

      <CheckInModal open={checkInOpen} initialRooms={checkInRooms} allRooms={rooms}
        existingRefs={existingRefs} defaultRate={dbApi.settings.defaultRate}
        onClose={()=>setCheckInOpen(false)} onConfirm={confirmCheckIn}/>
    </div>
  );
}

/* ============================== OWNER: LEDGER ============================== */
function Ledger({ dbApi, pushToast }){
  const { txns } = dbApi;
  const [q, setQ] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [paymentFilter, setPaymentFilter] = useState('all');

  const filtered = useMemo(()=>{
    return txns.filter(t=>{
      if(statusFilter!=='all' && t.status!==statusFilter) return false;
      if(paymentFilter!=='all' && t.paymentMethod!==paymentFilter) return false;
      if(q.trim()){
        const hay = `${t.ref} ${t.guestName} ${(t.roomIds||[]).join(' ')}`.toLowerCase();
        if(!hay.includes(q.trim().toLowerCase())) return false;
      }
      return true;
    });
  },[txns, q, statusFilter, paymentFilter]);

  const exportRows = (rows) => rows.map(t=>({
    'Reference #': t.ref,
    'Date & Time In': fmtDateTime(t.timeIn),
    'Date & Time Out': fmtDateTime(t.timeOut),
    'Guest Name': t.guestName,
    'Room(s)': (t.roomIds||[]).join(', '),
    'Duration (hrs)': t.hours,
    'Payment Method': t.paymentMethod,
    'Total Amount': t.totalAmount,
    'Status': t.status === 'active' ? 'Active' : 'Completed',
  }));

  const exportXlsx = () => {
    try{
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(exportRows(filtered));
      ws['!cols'] = [{wch:20},{wch:20},{wch:20},{wch:20},{wch:12},{wch:12},{wch:16},{wch:14},{wch:12}];
      XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
      const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      browserDownload(`inn-transactions-${new Date().toISOString().slice(0,10)}.xlsx`, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      pushToast('Spreadsheet exported.');
    }catch(e){
      pushToast('Export failed. Please try again.', 'error');
    }
  };

  const exportCsv = () => {
    try{
      const ws = XLSX.utils.json_to_sheet(exportRows(filtered));
      const csv = XLSX.utils.sheet_to_csv(ws);
      browserDownload(`inn-transactions-${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv');
      pushToast('CSV exported.');
    }catch(e){
      pushToast('Export failed. Please try again.', 'error');
    }
  };

  return (
    <div>
      <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-4">
        <div className="relative w-full lg:w-72">
          <SearchIcon size={16} className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:'var(--text-muted-c)'}}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search reference, guest, room…"
            className="focus-ring w-full pl-9 pr-3 py-2 rounded-lg border bg-transparent outline-none text-sm"
            style={{borderColor:'var(--line)'}}/>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}
            className="focus-ring px-3 py-2 rounded-lg border bg-transparent outline-none text-sm" style={{borderColor:'var(--line)'}}>
            <option value="all" style={{color:'#111'}}>All statuses</option>
            <option value="active" style={{color:'#111'}}>Active</option>
            <option value="completed" style={{color:'#111'}}>Completed</option>
          </select>
          <select value={paymentFilter} onChange={e=>setPaymentFilter(e.target.value)}
            className="focus-ring px-3 py-2 rounded-lg border bg-transparent outline-none text-sm" style={{borderColor:'var(--line)'}}>
            <option value="all" style={{color:'#111'}}>All payment methods</option>
            {PAYMENT_METHODS.map(m=> <option key={m} value={m} style={{color:'#111'}}>{m}</option>)}
          </select>
          <button onClick={exportCsv}
            className="focus-ring flex items-center gap-1.5 px-3 py-2 rounded-lg border text-sm font-semibold hover:border-[var(--brass-bright)]" style={{borderColor:'var(--line)'}}>
            <DownloadIcon size={15}/> CSV
          </button>
          <button onClick={exportXlsx}
            className="focus-ring flex items-center gap-1.5 px-3 py-2 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white text-sm font-bold">
            <SheetIcon size={15}/> Export to Excel
          </button>
        </div>
      </div>

      <div className="rounded-xl border overflow-hidden" style={{borderColor:'var(--line)'}}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{background:'rgba(201,162,75,.10)'}}>
                {['Reference #','Time In','Time Out','Guest','Room(s)','Hrs','Payment','Amount','Status'].map(h=>(
                  <th key={h} className="text-left font-semibold px-4 py-3 whitespace-nowrap" style={{color:'var(--text-muted-c)'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length===0 && (
                <tr><td colSpan={9} className="px-4 py-10 text-center" style={{color:'var(--text-muted-c)'}}>No transactions match your filters.</td></tr>
              )}

  );
}

/* ============================== OWNER: REPORTS ============================== */
function Reports({ dbApi, pushToast }){
  const { txns, settings } = dbApi;

  const last7 = useMemo(()=>{
    const cutoff = Date.now() - 7*24*3600000;
    return txns.filter(t=> new Date(t.createdAt||t.timeIn).getTime() >= cutoff);
  },[txns]);

  const totalRevenue7 = last7.reduce((s,t)=> s + (Number(t.totalAmount)||0), 0);

  const generateNow = () => {
    try{
      const ws = XLSX.utils.json_to_sheet(last7.map(t=>({
        'Reference #': t.ref, 'Time In': fmtDateTime(t.timeIn), 'Time Out': fmtDateTime(t.timeOut),
        'Guest': t.guestName, 'Room(s)': (t.roomIds||[]).join(', '), 'Hrs': t.hours,
        'Payment': t.paymentMethod, 'Amount': t.totalAmount, 'Status': t.status,
      })));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Last 7 Days');
      const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      browserDownload(`weekly-report-${new Date().toISOString().slice(0,10)}.xlsx`, buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      pushToast('Weekly report generated.');
    }catch(e){
      if(e && e.code==='declined') return;
      pushToast('Report generation failed.', 'error');
    }
  };

  return (
    <div className="space-y-6">
      <div className="grid sm:grid-cols-3 gap-4">
        <div className="rounded-xl border p-5" style={{borderColor:'var(--line)'}}>
          <div className="text-xs uppercase tracking-wide font-semibold" style={{color:'var(--text-muted-c)'}}>Transactions, last 7 days</div>
          <div className="font-display text-3xl font-semibold mt-1 tabular">{last7.length}</div>
        </div>
        <div className="rounded-xl border p-5" style={{borderColor:'var(--line)'}}>
          <div className="text-xs uppercase tracking-wide font-semibold" style={{color:'var(--text-muted-c)'}}>Revenue, last 7 days</div>
          <div className="font-display text-3xl font-semibold mt-1 tabular">{fmtMoney(totalRevenue7)}</div>
        </div>
        <div className="rounded-xl border p-5" style={{borderColor:'var(--line)'}}>
          <div className="text-xs uppercase tracking-wide font-semibold" style={{color:'var(--text-muted-c)'}}>Report recipient{(settings.recipientEmails||[]).length ? 's' : ''}</div>
          <div className="text-sm font-semibold mt-1 leading-snug">{[settings.ownerEmail, ...(settings.recipientEmails||[])].filter(Boolean).join(', ')}</div>
        </div>
      </div>

      <div className="rounded-xl border p-5" style={{borderColor:'var(--line)'}}>
        <div className="flex items-start gap-3">
          <div className="p-2 rounded-lg bg-[var(--brass)]/15 text-[var(--brass-bright)]"><MailIcon size={20}/></div>
          <div className="flex-1">
            <div className="font-display text-lg font-semibold">Automated weekly email report</div>
            <p className="text-sm mt-1" style={{color:'var(--text-muted-c)'}}>
              In production, a Supabase Edge Function runs on a weekly schedule, packages the past 7 days of
              transactions into a spreadsheet, and emails it to <strong>{[settings.ownerEmail, ...(settings.recipientEmails||[])].filter(Boolean).join(', ')}</strong> via the Resend API.
              This browser demo can't dispatch real email or run a server-side cron job — use the button below to generate
              the same report on demand, and see the downloadable source bundle for the deployable Edge Function.
            </p>
            <button onClick={generateNow}
              className="focus-ring mt-3 flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white font-semibold text-sm">
              <DownloadIcon size={16}/> Generate Last-7-Days Report Now
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== OWNER: ADMIN SETTINGS ============================== */
function AdminSettings({ dbApi, pushToast }){
  const { rooms, settings } = dbApi;
  const [form, setForm] = useState(settings);
  const [newRoom, setNewRoom] = useState({ number:'', rate: settings.defaultRate||180 });
  const [newRecipient, setNewRecipient] = useState('');

  useEffect(()=> setForm(settings), [settings]);

  const addRecipient = () => {
    const email = newRecipient.trim();
    if(!email){ return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ pushToast('Enter a valid email address.', 'error'); return; }
    const list = form.recipientEmails||[];
    if(email===form.ownerEmail || list.includes(email)){ pushToast('That email is already added.', 'error'); return; }
    setForm(f=>({...f, recipientEmails:[...list, email]}));
    setNewRecipient('');
  };
  const removeRecipient = (email) => {
    setForm(f=>({...f, recipientEmails:(f.recipientEmails||[]).filter(e=>e!==email)}));
  };

  const saveSettings = async () => {
    try{
      await dbApi.saveSettings(form);
      pushToast('Settings saved.');
    }catch(e){ pushToast('Could not save settings.', 'error'); }
  };

  const updateRoomRate = async (room, rate) => {
    await dbApi.saveRoom({ ...room, rate: Number(rate)||0 });
  };

  const removeRoom = async (room) => {
    if(room.status==='occupied'){ pushToast('Cannot remove an occupied room.', 'error'); return; }
    await dbApi.deleteRoom(room.id);
    pushToast(`Room ${room.number} removed.`);
  };

  const addRoom = async () => {
    const number = newRoom.number.trim();
    if(!number){ pushToast('Enter a room number.', 'error'); return; }
    if(rooms.some(r=>r.id===number)){ pushToast('That room number already exists.', 'error'); return; }
    await dbApi.saveRoom({ id:number, number, rate:Number(newRoom.rate)||settings.defaultRate, status:'vacant', txnId:null, guestName:null, timeOut:null });
    setNewRoom({ number:'', rate: settings.defaultRate });
    pushToast(`Room ${number} added.`);
  };

  return (
    <div className="space-y-8">
      <section>
        <h3 className="font-display text-lg font-semibold mb-3">Rooms &amp; hourly rates</h3>
        <div className="rounded-xl border overflow-hidden" style={{borderColor:'var(--line)'}}>
         <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{background:'rgba(201,162,75,.10)'}}>
                <th className="text-left font-semibold px-4 py-2.5" style={{color:'var(--text-muted-c)'}}>Room #</th>
                <th className="text-left font-semibold px-4 py-2.5" style={{color:'var(--text-muted-c)'}}>Hourly rate (₱)</th>
                <th className="text-left font-semibold px-4 py-2.5" style={{color:'var(--text-muted-c)'}}>Status</th>
                <th className="px-4 py-2.5"></th>
              </tr>
            </thead>
            <tbody>
              {rooms.map(r=>(
                <tr key={r.id} className="border-t" style={{borderColor:'var(--line)'}}>
                  <td className="px-4 py-2.5 font-semibold">{r.number}</td>
                  <td className="px-4 py-2.5">
                    <input type="number" defaultValue={r.rate} onBlur={e=>updateRoomRate(r, e.target.value)}
                      className="focus-ring w-24 px-2 py-1 rounded-md border bg-transparent outline-none tabular" style={{borderColor:'var(--line)'}}/>
                  </td>
                  <td className="px-4 py-2.5">
                    <span className={"px-2 py-0.5 rounded-full text-xs font-semibold " + (r.status==='occupied' ? "bg-[var(--occupied)]/20 text-[var(--occupied-bright)]" : "bg-[var(--vacant)]/20 text-[var(--vacant-bright)]")}>
                      {r.status==='occupied' ? 'Occupied' : 'Vacant'}
                    </span>
                  </td>
                  <td className="px-4 py-2.5 text-right">
                    <button onClick={()=>removeRoom(r)} className="focus-ring p-1.5 rounded-md hover:bg-[var(--overdue)]/20 text-[var(--overdue-bright)]"><TrashIcon size={15}/></button>
                  </td>
                </tr>
              ))}
              <tr className="border-t" style={{borderColor:'var(--line)'}}>
                <td className="px-4 py-2.5">
                  <input value={newRoom.number} onChange={e=>setNewRoom(n=>({...n, number:e.target.value}))} placeholder="e.g. 111"
                    className="focus-ring w-24 px-2 py-1 rounded-md border bg-transparent outline-none" style={{borderColor:'var(--line)'}}/>
                </td>
                <td className="px-4 py-2.5">
                  <input type="number" value={newRoom.rate} onChange={e=>setNewRoom(n=>({...n, rate:e.target.value}))}
                    className="focus-ring w-24 px-2 py-1 rounded-md border bg-transparent outline-none tabular" style={{borderColor:'var(--line)'}}/>
                </td>
                <td></td>
                <td className="px-4 py-2.5 text-right">
                  <button onClick={addRoom} className="focus-ring inline-flex items-center gap-1 px-3 py-1.5 rounded-md bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white text-xs font-bold">
                    <PlusIcon size={13}/> Add Room
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
         </div>
        </div>
      </section>

      <section>
        <h3 className="font-display text-lg font-semibold mb-3">System settings</h3>
        <div className="grid sm:grid-cols-2 gap-4 max-w-2xl">
          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Property name</label>
            <input value={form.innName} onChange={e=>setForm(f=>({...f, innName:e.target.value}))}
              className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none" style={{borderColor:'var(--line)'}}/>
          </div>
          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Tagline</label>
            <input value={form.tagline||''} onChange={e=>setForm(f=>({...f, tagline:e.target.value}))}
              className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none" style={{borderColor:'var(--line)'}}/>
          </div>
          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Default hourly rate (₱)</label>
            <input type="number" value={form.defaultRate} onChange={e=>setForm(f=>({...f, defaultRate:Number(e.target.value)}))}
              className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none tabular" style={{borderColor:'var(--line)'}}/>
          </div>
          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Tax rate (%)</label>
            <input type="number" value={form.taxRate} onChange={e=>setForm(f=>({...f, taxRate:Number(e.target.value)}))}
              className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none tabular" style={{borderColor:'var(--line)'}}/>
          </div>
          <div>
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Weekly report recipient email</label>
            <input type="email" value={form.ownerEmail} onChange={e=>setForm(f=>({...f, ownerEmail:e.target.value}))}
              className="focus-ring mt-1 w-full px-3 py-2 rounded-lg border bg-transparent outline-none" style={{borderColor:'var(--line)'}}/>
          </div>
          <div className="sm:col-span-2">
            <label className="text-xs font-semibold uppercase tracking-wide" style={{color:'var(--text-muted-c)'}}>Additional recipients</label>
            <div className="mt-1 flex flex-col sm:flex-row gap-2">
              <input type="email" value={newRecipient} onChange={e=>setNewRecipient(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); addRecipient(); } }}
                placeholder="another.email@example.com"
                className="focus-ring flex-1 px-3 py-2 rounded-lg border bg-transparent outline-none" style={{borderColor:'var(--line)'}}/>
              <button type="button" onClick={addRecipient}
                className="focus-ring shrink-0 flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white text-sm font-bold">
                <PlusIcon size={14}/> Add
              </button>
            </div>
            {(form.recipientEmails||[]).length>0 && (
              <div className="mt-2 flex flex-wrap gap-2">
                {form.recipientEmails.map(email=>(
                  <span key={email} className="inline-flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full border text-xs font-semibold" style={{borderColor:'var(--line)'}}>
                    {email}
                    <button type="button" onClick={()=>removeRecipient(email)} className="focus-ring p-0.5 rounded-full hover:bg-[var(--overdue)]/20 text-[var(--overdue-bright)]">
                      <XIcon size={12}/>
                    </button>
                  </span>
                ))}
              </div>
            )}
          </div>
        </div>
        <button onClick={saveSettings}
          className="focus-ring mt-4 flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white font-semibold text-sm">
          <CheckIcon size={16}/> Save Settings
        </button>
      </section>
    </div>
  );
}

                  className="focus-ring w-full px-3 py-2.5 rounded-lg border bg-transparent outline-none text-sm" style={{borderColor:'var(--line)'}}/>
                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password"
                  className="focus-ring w-full px-3 py-2.5 rounded-lg border bg-transparent outline-none text-sm" style={{borderColor:'var(--line)'}}/>
              </div>
              {error && <div className="mt-2 text-sm text-[var(--overdue-bright)] flex items-center gap-1.5"><AlertIcon size={14}/>{error}</div>}
              <div className="mt-2 text-xs" style={{color:'var(--text-muted-c)'}}>Temporary access — username <strong>owner</strong>, password <strong>123</strong></div>
              <div className="mt-4 flex gap-2">
                <button type="button" onClick={()=>{ setOwnerOpen(false); setError(''); }}
                  className="focus-ring flex-1 px-4 py-2.5 rounded-lg border text-sm font-semibold" style={{borderColor:'var(--line)'}}>Cancel</button>
                <button type="submit"
                  className="focus-ring flex-1 px-4 py-2.5 rounded-lg bg-[var(--brass)] hover:bg-[var(--brass-bright)] text-white text-sm font-bold">Sign In</button>
              </div>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT APP ============================== */
function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSet(key, val){ try{ localStorage.setItem(key, val); }catch(e){ /* noop */ } }
function safeRemove(key){ try{ localStorage.removeItem(key); }catch(e){ /* noop */ } }

function App(){
  const { push: pushToast, view: toastView } = useToasts();
  const dbApi = useInnDb(pushToast);
  const [view, setView] = useState('frontdesk');
  const [role, setRole] = useState(()=> safeGet('mamela_role'));
  const [theme, setTheme] = useState(()=> safeGet('mamela_theme') || 'light');

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme', theme);
    safeSet('mamela_theme', theme);
  },[theme]);

  const toggleTheme = () => setTheme(t => t==='dark' ? 'light' : 'dark');

  const handleFrontDesk = () => { setRole('frontdesk'); setView('frontdesk'); safeSet('mamela_role','frontdesk'); };
  const handleOwnerLogin = () => { setRole('owner'); setView('frontdesk'); safeSet('mamela_role','owner'); pushToast('Signed in as owner.'); };
  const handleLogout = () => { setRole(null); safeRemove('mamela_role'); };

  if(!role){
    return <LandingPage innName={dbApi.settings.innName} tagline={dbApi.settings.tagline}
      onFrontDesk={handleFrontDesk} onOwnerLogin={handleOwnerLogin}
      theme={theme} toggleTheme={toggleTheme}/>;
  }

  const effectiveView = role==='owner' ? view : 'frontdesk';

  return (
    <div className="min-h-screen" style={{ background:'var(--bg)', color:'var(--text)' }}>
      <Header view={effectiveView} setView={setView} innName={dbApi.settings.innName}
        role={role} onLogout={handleLogout} theme={theme} toggleTheme={toggleTheme}/>
      <main className="max-w-7xl mx-auto px-5 py-6">
        {!dbApi.ready ? (
          <div className="py-24 text-center" style={{color:'var(--text-muted-c)'}}>Loading front desk…</div>
        ) : (
          effectiveView==='frontdesk'
            ? <FrontDesk dbApi={dbApi} pushToast={pushToast}/>
            : <OwnerDashboard dbApi={dbApi} pushToast={pushToast}/>
        )}
      </main>
      <div className="max-w-7xl mx-auto px-5 pb-6 text-xs" style={{color:'var(--text-muted-c)'}}>
        Data is saved in this browser's storage only (not shared across devices). For multi-device, real-time data, connect this app to Supabase — see the included README.
      </div>
      {toastView}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
